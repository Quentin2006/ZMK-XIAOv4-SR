# --- PMW3610 trackball (right half only) ---
CONFIG_PMW3610=y
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Report every sensor frame (~125 Hz). A non-zero minimum interval makes the
# driver throw away movement when frames arrive slightly off-beat, which shows
# up as choppy / lost slow movement. Set back to 8 if the pointer ever lags
# behind over Bluetooth.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=0

# Stay in full-rate RUN mode for ~1 s after the ball stops (default 128 ms) so
# small corrections and start-of-motion don't hit the slow 40 ms REST1 sampling.
# Must be a multiple of 32.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=1024
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

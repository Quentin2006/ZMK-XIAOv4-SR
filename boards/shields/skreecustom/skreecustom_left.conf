# --- Host-facing BLE link (left/central half only) ---
# ZMK defaults to a 7.5-15 ms preferred connection interval; Linux/BlueZ has
# been choosing the 15 ms top of that range. At 15 ms the host only gets ~66.7
# update opportunities per second, so the 125 Hz PMW3610 frames arrive in
# 2-4 report bursts every 15 ms. Force the standard BLE minimum (7.5 ms,
# 6 x 1.25 ms) so the 125 Hz frames map roughly 1:1 to connection events.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# Keep slave latency for idle power; the host link is still active every
# 7.5 ms while the trackball/keys have data to send. Set to 0 only if
# first-motion timing needs to be maximally deterministic.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Explicitly keep Zephyr's automatic parameter update and GAP PPCP enabled.
# The request is sent 5 s after connection, per the Bluetooth spec.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
